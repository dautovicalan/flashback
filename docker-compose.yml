services:
  db:
    image: postgres:15.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flashback
      PGPORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashback"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - flashback-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: elasticsearch-flashback
    environment:
      - discovery.type=single-node
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=flashback
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./esdata:/usr/share/elasticsearch/data
    networks:
      - flashback-network

  back:
    build: ./back
    ports:
      - "8080:8080"
    env_file:
      - ./back/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flashback-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-flashback
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - flashback-network

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana-flashback
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources.yml
    networks:
      - flashback-network

  front:
    build: ./front
    environment:
      - VITE_BACKEND_API_URL=http://localhost:8080/api/v1
      - VITE_KEYCLOAK_URL=http://localhost:8090
      - VITE_KEYCLOAK_REALM=flashback
      - VITE_KEYCLOAK_CLIENT_ID=flashback-client
    ports:
      - "5173:80"
    depends_on:
      - back
    networks:
      - flashback-network

networks:
  flashback-network:
    driver: bridge
    external: true
